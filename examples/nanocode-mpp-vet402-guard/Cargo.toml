[package]
name = "nanocode-mpp-vet402-guard"
version = "0.1.0"
edition = "2021"
publish = false
description = "Wrap Nanocode MPP Exchange with a vet402 seller check before payment"

[dependencies]
nanocode-mpp = { git = "https://github.com/nanocodexyz/nanocode.git", rev = "e376d6d" }
nanocode-http = { git = "https://github.com/nanocodexyz/nanocode.git", rev = "e376d6d" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["rt", "macros"] }